name: Publish Singularity Watch

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
      timezone: 'America/New_York'
    - cron: '0 16 * * *'
      timezone: 'America/New_York'
    - cron: '30 9 * * *'
      timezone: 'America/New_York'

concurrency:
  group: singularity-pages
  queue: max

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
      actions: read
    env:
      OBSERVATORY_CANDIDATE_DIR: ${{ github.workspace }}/.pending-evidence
      OBSERVATORY_ARCHIVE_DIR: ${{ github.workspace }}/.observatory-archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Restore the durable assessment archive
        run: bash scripts/prepare-archive.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Identify the original scheduled run
        if: github.event_name == 'schedule'
        run: |
          created=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          echo "OBSERVATORY_RUN_CREATED_AT=$created" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Test measurement, archive and checkpoint rules
        run: node --test
      - name: Read intervening discovery captures
        run: bash scripts/read-candidates.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build using the validated assessment
        run: npm run build
        env:
          PREVIOUS_SIGNALS_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/signals.json
          OBSERVATORY_CRON: ${{ github.event.schedule }}
      - name: Persist new immutable records before publishing
        run: bash scripts/persist-archive.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
